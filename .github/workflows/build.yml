name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # the wrapper checks distributionSha256Sum itself; also validate the wrapper jar
          validate-wrappers: true
      - name: Build and unit tests
        run: ./gradlew build --no-daemon --stacktrace
        shell: bash
      - name: Integration test with the real VulkanMod / Sodium / ViaFabricPlus artifacts
        run: ./gradlew :launcher-core:integrationTest --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/**'

  windows-release:
    name: Windows release (EXE, ZIP, installer)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build release
        run: ./gradlew :launcher-app:installerExe :launcher-app:releaseDist --no-daemon
        shell: bash
      - name: Silent install test of the Inno Setup installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\release\LumoraClient-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\LumoraClient\LumoraLauncher.exe")) { exit 1 }
      - name: Launcher self-check (no game start, no account)
        shell: pwsh
        run: |
          $env:LUMORA_HOME = "$env:RUNNER_TEMP\lumora-home"
          & build\release\LumoraLauncher\LumoraLauncherCli.exe --version
          & build\release\LumoraLauncher\LumoraLauncherCli.exe --install-only --profile vulkan
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # A full --smoke-test needs a GPU; hosted runners have none. Run it on a self-hosted GPU runner.
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-client-windows
          path: |
            build/release/*.zip
            build/release/*.exe
            build/release/SHA256SUMS.txt
            build/release/README.txt
            build/release/licenses/**
