[libraries]
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
# oldest Gson that Minecraft ships (2.2.4 in 1.8.9 and 1.12.2): lumora-core compiles against it, so it runs on every version
gson-minecraft-min = { module = "com.google.code.gson:gson", version = "2.2.4" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-inter = { module = "com.formdev:flatlaf-fonts-inter", version.ref = "flatlaf-inter" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "loom" }
