# /etc/nginx/sites-available/lumora (linked into sites-enabled). TLS certificates by certbot (Let's Encrypt);
# certbot adds the "listen 443 ssl" lines and the redirect from port 80 itself.
map $http_upgrade $lumora_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name lumora.jardateien.de;

    # health check for monitoring
    location = /health {
        proxy_pass http://127.0.0.1:25600/health;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket of the Lumora backend (wss://lumora.jardateien.de/)
    location / {
        proxy_pass http://127.0.0.1:25600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lumora_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # clients send a heartbeat every 30 s; idle connections stay open
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # frames above 64 KiB are refused by the backend anyway
        client_max_body_size 64k;
    }
}
